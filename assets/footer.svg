<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">Let's build something useful</title>
  <desc id="footerDesc">An animated footer with a gradient line, soft glowing light, and contact details for Priyanshu.</desc>

  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070A"/>
      <stop offset="1" stop-color="#0C0C12"/>
    </linearGradient>

    <linearGradient id="footerAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9F75A"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
      <animate attributeName="x1" values="-0.4;0.2;-0.4" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="footerText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F2EC"/>
      <stop offset="0.55" stop-color="#D9FF7A"/>
      <stop offset="1" stop-color="#A78BFA"/>
      <animate attributeName="x1" values="-0.4;0.2;-0.4" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="footerBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <clipPath id="footerClip">
      <rect width="1200" height="190" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="1200" height="190" fill="url(#footerBg)"/>
    <g filter="url(#footerBlur)">
      <circle cx="200" cy="180" r="150" fill="#C9F75A" opacity="0.12">
        <animate attributeName="cx" values="200;270;200" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="10" r="160" fill="#A78BFA" opacity="0.14">
        <animate attributeName="cx" values="1020;950;1020" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path d="M1 1H1199" stroke="url(#footerAccent)" stroke-width="1.5" opacity="0.8"/>
    <rect x="1" y="1" width="1198" height="188" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
      <text x="600" y="82" fill="url(#footerText)" font-size="30" font-weight="700" letter-spacing="-0.7">
        Let's build something people actually use.
      </text>
      <text x="600" y="114" fill="#9B99A7" font-size="14">
        Open to internships, collaborations, and hard problems.
      </text>

      <g font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="12.5" letter-spacing="0.4">
        <text x="600" y="153" fill="#C9F75A">py431035@gmail.com</text>
        <text x="600" y="173" fill="#6F6D7C">github.com/py43-cmd</text>
      </g>
    </g>

    <circle cx="505" cy="149" r="3" fill="#C9F75A">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
