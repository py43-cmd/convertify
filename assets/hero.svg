<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Priyanshu — Full Stack Developer</title>
  <desc id="heroDesc">An animated banner with an acid-lime and violet gradient, floating light blobs, and a code card introducing Priyanshu, a full stack developer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070A"/>
      <stop offset="0.55" stop-color="#0B0B12"/>
      <stop offset="1" stop-color="#10100A"/>
    </linearGradient>

    <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9F75A"/>
      <stop offset="0.52" stop-color="#F1FFD0"/>
      <stop offset="1" stop-color="#A78BFA"/>
      <animate attributeName="x1" values="-0.6;0.2;-0.6" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.8;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9F75A" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.30"/>
    </linearGradient>

    <radialGradient id="gridFadeGrad" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <mask id="gridMask">
      <rect width="1200" height="340" fill="url(#gridFadeGrad)"/>
    </mask>

    <clipPath id="cardClip">
      <rect width="1200" height="340" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>

    <g filter="url(#blur)">
      <circle cx="105" cy="30" r="175" fill="#C9F75A" opacity="0.20">
        <animate attributeName="cx" values="105;185;105" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="30;92;30" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.20;0.28;0.20" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="610" cy="-20" r="155" fill="#A78BFA" opacity="0.19">
        <animate attributeName="cx" values="610;540;610" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-20;55;-20" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1050" cy="340" r="215" fill="#38BDF8" opacity="0.13">
        <animate attributeName="cx" values="1050;960;1050" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="340;270;340" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="1" y="1" width="1198" height="338" rx="23.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <rect x="0" y="-24" width="1200" height="1" fill="#C9F75A" opacity="0">
      <animate attributeName="y" values="-24;364" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.22;0" dur="7.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Availability pill -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(60 38)">
      <rect width="230" height="34" rx="17" fill="#C9F75A" fill-opacity="0.08" stroke="#C9F75A" stroke-opacity="0.28"/>
      <circle cx="18" cy="17" r="4" fill="#C9F75A">
        <animate attributeName="opacity" values="1;0.18;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="21.5" fill="#D9FF7A" font-size="11" font-weight="700" letter-spacing="2.1">OPEN TO INTERNSHIPS</text>
    </g>

    <!-- Hero copy -->
    <text x="60" y="156" fill="#F4F2EC" font-size="60" font-weight="700" letter-spacing="-2.2">
      Hi, I'm <tspan fill="url(#gradText)">Priyanshu</tspan><tspan fill="#C9F75A">.</tspan>
    </text>
    <text x="62" y="196" fill="#AAA8B6" font-size="18" font-weight="500" letter-spacing="0.2">
      Full Stack Developer · React + Node.js + MongoDB
    </text>

    <g font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#8E8C9C" letter-spacing="0.1">
      <text x="62" y="238">
        <tspan fill="#C9F75A">$</tspan> building secure, production-minded products — end to end
      </text>
    </g>
    <rect x="62" y="250" width="7" height="14" fill="#C9F75A">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom metadata -->
    <path d="M60 287H740" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.2">
      <text x="62" y="312" fill="#6F6D7C">MERN · AI · DOCUMENT PIPELINES · PAYMENTS</text>
      <text x="740" y="312" fill="#6F6D7C" text-anchor="end">SCROLL TO EXPLORE ↓</text>
    </g>
  </g>

  <!-- Code card -->
  <g transform="translate(770 58)" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace">
    <rect width="370" height="228" rx="16" fill="#0C0C12" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M0 34H370" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect width="370" height="34" rx="16" fill="#FFFFFF" fill-opacity="0.025"/>
    <rect x="0" y="18" width="370" height="16" fill="#0C0C12" fill-opacity="0.3"/>

    <circle cx="18" cy="17" r="4" fill="#FF5F57"/>
    <circle cx="32" cy="17" r="4" fill="#FEBC2E"/>
    <circle cx="46" cy="17" r="4" fill="#28C840"/>
    <text x="62" y="21.5" fill="#8A8896" font-size="11">priyanshu.js</text>

    <circle cx="325" cy="17" r="3" fill="#C9F75A">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="360" y="21" fill="#6F6D7C" font-size="10" text-anchor="end">live</text>

    <g font-size="12.5">
      <text x="18" y="62" fill="#6F6D7C">// a quick introduction</text>
      <text x="18" y="84">
        <tspan fill="#C9F75A">const</tspan><tspan fill="#F4F2EC"> priyanshu </tspan><tspan fill="#8A8896">= {</tspan>
      </text>
      <text x="34" y="106">
        <tspan fill="#A78BFA">role</tspan><tspan fill="#8A8896">: </tspan><tspan fill="#D9FF7A">"Full Stack Developer"</tspan><tspan fill="#8A8896">,</tspan>
      </text>
      <text x="34" y="128">
        <tspan fill="#A78BFA">stack</tspan><tspan fill="#8A8896">: [</tspan><tspan fill="#D9FF7A">"React"</tspan><tspan fill="#8A8896">, </tspan><tspan fill="#D9FF7A">"Node"</tspan><tspan fill="#8A8896">, </tspan><tspan fill="#D9FF7A">"MongoDB"</tspan><tspan fill="#8A8896">],</tspan>
      </text>
      <text x="34" y="150">
        <tspan fill="#A78BFA">building</tspan><tspan fill="#8A8896">: </tspan><tspan fill="#D9FF7A">"DevFlow AI"</tspan><tspan fill="#8A8896">,</tspan>
      </text>
      <text x="34" y="172">
        <tspan fill="#A78BFA">openTo</tspan><tspan fill="#8A8896">: </tspan><tspan fill="#D9FF7A">"internships"</tspan><tspan fill="#8A8896">,</tspan>
      </text>
      <text x="34" y="194">
        <tspan fill="#A78BFA">shipsEndToEnd</tspan><tspan fill="#8A8896">: </tspan><tspan fill="#C9F75A">true</tspan><tspan fill="#8A8896">,</tspan>
      </text>
      <text x="18" y="216" fill="#8A8896">};</text>
    </g>

    <rect x="0.75" y="0.75" width="368.5" height="226.5" rx="15.5" fill="none" stroke="url(#gradText)" stroke-opacity="0.30" stroke-dasharray="24 18">
      <animate attributeName="stroke-dashoffset" values="0;-84" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Decorative spark -->
  <g transform="translate(1138 44)" fill="#C9F75A" filter="url(#softGlow)">
    <path d="M0 -8L2.2 -2.2L8 0L2.2 2.2L0 8L-2.2 2.2L-8 0L-2.2 -2.2Z" opacity="0.8">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;45;0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
